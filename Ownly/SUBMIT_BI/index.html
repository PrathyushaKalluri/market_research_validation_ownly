<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ownly Gachibowli — BI Workbook</title>
<style>
:root{
  --ground:#eef1f5; --paper:#ffffff; --paper2:#f7f9fb; --ink:#10151a; --ink2:#48535e;
  --muted:#7b8590; --line:#e0e5ea; --line2:#c9d1d8;
  --accent:#2a78d6; --soft:#e9f1fc;
  --side:#1b2430; --side2:#243040; --sideink:#cfd8e3; --sideink2:#8695a8;
  --good:#0ca30c; --goodink:#006300; --warn:#fab219; --warnink:#8a5d00; --crit:#d03b3b;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;}

/* ══════════ SIDEBAR ══════════ */
#side{width:252px;flex:none;background:var(--side);color:var(--sideink);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;overflow-y:auto;}
#side .brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.09);}
#side .brand h1{font-size:15px;margin:0 0 3px;font-weight:700;color:#fff;letter-spacing:-.01em;}
#side .brand p{font-size:11px;margin:0;color:var(--sideink2);font-family:var(--mono);line-height:1.5;}
#side .grp{padding:14px 0 6px;}
#side .grplab{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sideink2);padding:0 18px 8px;}
#side nav a{display:flex;align-items:center;gap:10px;padding:9px 18px;color:var(--sideink);text-decoration:none;font-size:13px;border-left:3px solid transparent;}
#side nav a:hover{background:var(--side2);color:#fff;}
#side nav a.on{background:var(--side2);color:#fff;border-left-color:var(--accent);font-weight:600;}
#side nav a .ic{width:15px;height:15px;flex:none;opacity:.85;}
#filters{padding:6px 18px 18px;border-top:1px solid rgba(255,255,255,.09);margin-top:6px;}
.fgrp{margin-bottom:13px;}
.fgrp label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sideink2);margin-bottom:5px;}
.fgrp select{width:100%;font:inherit;font-size:12.5px;padding:6px 8px;border-radius:5px;border:1px solid rgba(255,255,255,.16);background:var(--side2);color:#fff;}
.fgrp select:focus{outline:2px solid var(--accent);outline-offset:1px;}
#fstat{font-family:var(--mono);font-size:11px;color:var(--sideink2);margin-top:12px;line-height:1.5;}
#fstat b{color:#fff;}
#freset{width:100%;margin-top:10px;font:inherit;font-size:12px;padding:7px;border-radius:5px;border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--sideink);cursor:pointer;}
#freset:hover{background:var(--side2);color:#fff;}

/* ══════════ MAIN ══════════ */
#main{flex:1;min-width:0;height:100vh;overflow-y:auto;}
#top{position:sticky;top:0;z-index:20;background:rgba(238,241,245,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:16px 26px 14px;}
#top h2{font-size:21px;margin:0 0 3px;font-weight:700;letter-spacing:-.018em;}
#top p{margin:0;font-size:13px;color:var(--ink2);max-width:860px;}
#wrap{padding:20px 26px 60px;}

/* KPI strip */
.kstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:18px;}
.kcard{background:var(--paper);padding:13px 15px;}
.kcard .v{display:block;font-size:24px;font-weight:700;letter-spacing:-.025em;line-height:1.1;}
.kcard .k{display:block;font-size:11.5px;color:var(--ink2);margin-top:5px;line-height:1.35;}
.kcard .s{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px;}
.kcard.na .v{color:var(--muted);font-size:14px;}

/* card grid */
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr);}
.card{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:16px 18px 18px;box-shadow:0 1px 2px rgba(16,21,26,.04);min-width:0;grid-column:span 12;}
.card.h6{grid-column:span 6;} .card.h4{grid-column:span 4;} .card.h8{grid-column:span 8;}
.card.h5{grid-column:span 5;} .card.h7{grid-column:span 7;} .card.h3{grid-column:span 3;}
@media(max-width:1180px){.card.h4,.card.h3{grid-column:span 6;} .card.h5,.card.h7,.card.h8{grid-column:span 12;}}
@media(max-width:820px){.card,.card.h6,.card.h4,.card.h3{grid-column:span 12;}}
.card h3{font-size:14.5px;margin:0 0 2px;font-weight:600;}
.card .sub{font-size:11.5px;color:var(--muted);margin:0 0 13px;line-height:1.5;}
.card .note{font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.6;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);}
.card .note b{color:var(--ink2);font-weight:500;}

svg.chart{display:block;width:100%;height:auto;overflow:visible;}
svg.chart .ax{font-size:10.5px;fill:var(--muted);font-family:var(--sans);}
svg.chart .axlab{font-size:11px;fill:var(--ink2);font-family:var(--sans);font-weight:600;}
svg.chart .lbl{font-size:12px;fill:var(--ink);font-family:var(--sans);}
svg.chart .val{font-size:12.5px;fill:var(--ink);font-family:var(--sans);font-weight:600;}
svg.chart .inbar{font-size:10px;fill:#fff;font-family:var(--sans);font-weight:600;}
svg.chart .cell{font-size:10px;fill:var(--ink);font-family:var(--mono);}
svg.chart .tmlab{font-size:11.5px;fill:#fff;font-family:var(--sans);font-weight:600;}
svg.chart .tmval{font-size:11px;fill:rgba(255,255,255,.82);font-family:var(--mono);}
svg.chart .donutv{font-size:19px;fill:var(--ink);font-family:var(--sans);font-weight:700;}
svg.chart [data-tip]{cursor:default;}
svg.chart [data-tip]:hover{filter:brightness(1.12);}

.legend{display:flex;flex-wrap:wrap;gap:7px 16px;margin:0 0 12px;font-size:11.5px;color:var(--ink2);}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.sw{width:10px;height:10px;border-radius:3px;flex:none;}

/* tables */
.tw{overflow-x:auto;max-height:440px;overflow-y:auto;}
table{border-collapse:collapse;width:100%;font-size:12.5px;}
th,td{text-align:left;padding:7px 12px 7px 0;border-bottom:1px solid var(--line);vertical-align:top;}
th{position:sticky;top:0;background:var(--paper);font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom-color:var(--line2);white-space:nowrap;z-index:1;cursor:pointer;user-select:none;}
th:hover{color:var(--accent);}
td{color:var(--ink2);}
td b{color:var(--ink);}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;padding-right:0;}
tbody tr:hover{background:var(--paper2);}

.pill{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:4px;white-space:nowrap;}
.p-ok{background:#e4f6e4;color:var(--goodink);} .p-warn{background:#fdf1d6;color:var(--warnink);}
.p-bad{background:#fbe6e6;color:var(--crit);} .p-na{background:#eceff2;color:var(--muted);}
.p-info{background:var(--soft);color:var(--accent);}

.callout{background:var(--paper2);border-left:3px solid var(--accent);border-radius:0 7px 7px 0;padding:13px 16px;margin-top:14px;font-size:13px;color:var(--ink2);}
.callout.bad{border-left-color:var(--crit);background:#fdf2f2;}
.callout.warn{border-left-color:var(--warn);background:#fffaee;}
.callout b{color:var(--ink);}
.callout p{margin:0;} .callout p+p{margin-top:8px;}

/* scenario controls */
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;}
.slider label{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink2);margin-bottom:5px;gap:8px;}
.slider label b{font-family:var(--mono);font-size:13px;color:var(--accent);}
.slider input[type=range]{width:100%;accent-color:var(--accent);}
.slider .rng{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:2px;}
.outs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:16px;}
.out{background:var(--paper);padding:12px 14px;}
.out .v{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;}
.out .k{display:block;font-size:11px;color:var(--ink2);margin-top:4px;}

.verb{border-bottom:1px solid var(--line);padding:11px 0;}
.verb:last-child{border-bottom:0;}
.verb .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px;font-family:var(--mono);font-size:10px;color:var(--muted);}
.verb .txt{font-size:12.5px;color:var(--ink2);line-height:1.5;}

.tooltip{position:fixed;z-index:9999;pointer-events:none;background:#1b2430;color:#fff;font-size:11.5px;font-family:var(--sans);line-height:1.45;padding:7px 10px;border-radius:6px;max-width:300px;box-shadow:0 6px 20px rgba(0,0,0,.28);}
[hidden]{display:none!important;}

@media print{
  #side{display:none;} #main{height:auto;overflow:visible;} #top{position:static;}
  body{background:#fff;} .card{page-break-inside:avoid;box-shadow:none;}
  .tw{max-height:none;overflow:visible;}
}
@media(max-width:820px){
  body{flex-direction:column;}
  #side{width:100%;height:auto;position:static;}
  #main{height:auto;}
  #wrap{padding:16px 14px 50px;}
  #top{padding:13px 14px 12px;}
}
</style>
</head>
<body>

<aside id="side">
  <div class="brand">
    <h1>Ownly · Gachibowli</h1>
    <p>BI Workbook<br><span id="built"></span></p>
  </div>

  <div class="grp">
    <div class="grplab">Worksheets</div>
    <nav id="nav"></nav>
  </div>

  <div id="filters">
    <div class="grplab" style="padding-left:0">Global filters</div>
    <div class="fgrp">
      <label for="f-occ">Segment</label>
      <select id="f-occ"><option value="">All</option><option>Student</option><option>Working professional</option><option>Other</option></select>
    </div>
    <div class="fgrp">
      <label for="f-mem">Incumbent membership</label>
      <select id="f-mem"><option value="">All</option><option value="1">Holds a membership</option><option value="0">No membership</option></select>
    </div>
    <div class="fgrp">
      <label for="f-multi">Multi-homing</label>
      <select id="f-multi"><option value="">All</option><option value="1">Uses 2+ apps</option><option value="0">Single app</option></select>
    </div>
    <div class="fgrp">
      <label for="f-rap">Rapido user</label>
      <select id="f-rap"><option value="">All</option><option value="1">Uses Rapido</option><option value="0">Does not</option></select>
    </div>
    <div class="fgrp">
      <label for="f-aware">Ownly awareness</label>
      <select id="f-aware"><option value="">All</option><option value="1">Aware</option><option value="0">Not aware</option></select>
    </div>
    <div id="fstat"></div>
    <button id="freset" type="button">Reset all filters</button>
  </div>
</aside>

<div id="main">
  <div id="top"><h2 id="t-title"></h2><p id="t-sub"></p></div>
  <div id="wrap"><div class="kstrip" id="kstrip"></div><div class="grid" id="grid"></div></div>
</div>

<script src="bi_data.js"></script>
<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
