<script>
"use strict";
/* ================= constants (exact v6 wording) ================= */
const TRIGGER = ["A discount on my first order","My usual restaurants being on it","Seeing it's cheaper than Swiggy/Zomato for the same order","A promise of a quick refund if an order goes wrong","A friend telling me it works well","Paying by cash on delivery or meal card (Pluxee / Zeta)","Nothing, I'm happy with how I order now"];
const HEARD = ["Inside the Rapido app","Instagram / YouTube","Friends, classmates or colleagues","Hoardings, posters or street campaigns","News, LinkedIn or Reddit","Don't remember"];
const WHYNOT = ["I'm happy with my current app or membership","I don't trust a new app yet","I heard bad things about its delivery or support","I don't think it's really cheaper","Not sure it delivers to my area","I don't want another app on my phone","Just haven't got around to it"];
const STOPPED = ["My restaurants weren't there","Prices weren't lower than my usual app","A coupon on my usual app made that cheaper","It didn't deliver to my address","The delivery time looked too long","I couldn't pay the way I wanted","I was just looking around"];
const CF = ["Ordered the same on Swiggy or Zomato","Ordered on another app (Toing, Magicpin, etc.)","Ordered directly from the restaurant","Cooked, or eaten at home / mess / hostel","Gone out to eat","Skipped it or had a snack"];
const CHANGE = ["More restaurants","Faster delivery","More reliable, on-time delivery","Quicker refunds and support","A bigger price gap vs other apps","More offers and coupons","Cash on delivery or meal-card payment"];
const LESS = ["I don't order less than before","The restaurants I want aren't there","Late or failed deliveries","Refund or support problems","Prices are no longer clearly lower","Offers ended","Went back to my Swiggy One / Zomato Gold membership"];
const THRESH = ["₹10","₹20","₹30","₹50","₹75","₹100 or more","No amount, price alone wouldn't make me switch","Don't know"];
const THRESH_RS = [10,20,30,50,75,100,null,null];
const FAIR = ["Yes, it felt fair","No, the extra charges on top were too much","No, the food itself was overpriced","I didn't really look at the breakdown"];
const FAILS = ["An order arrived 15+ minutes later than shown","An order was cancelled or never delivered","An item was missing or wrong","A refund or support reply took more than 2 days"];
const RAPIDO = ["Never","1–3 times","About once a week","Several times a week"];
const SCALE = {"definitely not":1,"probably not":2,"not sure":3,"probably":4,"definitely":5};
const CITY_VAR = { Hyderabad: "--c-hyd", Bengaluru: "--c-blr", Other: "--c-none" };

/* ================= stats ================= */
function wilson(k, n, z) { z = z || 1.96; if (!n) return [NaN, NaN]; const p = k / n, d = 1 + z * z / n, c = p + z * z / (2 * n), m = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)); return [Math.max(0, (c - m) / d), Math.min(1, (c + m) / d)]; }
const LF = [0];
function logFact(n) { while (LF.length <= n) LF.push(LF[LF.length - 1] + Math.log(LF.length)); return LF[n]; }
function binom2(k, n) { if (!n) return NaN; const lp = i => logFact(n) - logFact(i) - logFact(n - i) + n * Math.log(0.5); const pk = lp(k); let s = 0; for (let i = 0; i <= n; i++) { const li = lp(i); if (li <= pk + 1e-7) s += Math.exp(li); } return Math.min(1, s); }
function fisher(a, b, c, d) {
  const r1 = a + b, r2 = c + d, c1 = a + c, n = r1 + r2; if (!r1 || !r2) return NaN;
  const lp = x => logFact(r1) + logFact(r2) + logFact(c1) + logFact(n - c1) - logFact(n) - logFact(x) - logFact(r1 - x) - logFact(c1 - x) - logFact(r2 - c1 + x);
  const obs = lp(a); let s = 0;
  for (let x = Math.max(0, c1 - r2); x <= Math.min(r1, c1); x++) { const l = lp(x); if (l <= obs + 1e-7) s += Math.exp(l); }
  return Math.min(1, s);
}
function newcombe(k1, n1, k2, n2) { // CI for p1 - p2
  if (!n1 || !n2) return [NaN, NaN];
  const p1 = k1 / n1, p2 = k2 / n2, [l1, u1] = wilson(k1, n1), [l2, u2] = wilson(k2, n2), d = p1 - p2;
  return [d - Math.sqrt((p1 - l1) ** 2 + (u2 - p2) ** 2), d + Math.sqrt((u1 - p1) ** 2 + (p2 - l2) ** 2)];
}
function twoProp(k1, n1, k2, n2) { // returns {diff, ci, p, test}
  if (!n1 || !n2) return { diff: NaN, ci: [NaN, NaN], p: NaN, test: "—" };
  const a = k1, b = n1 - k1, c = k2, d = n2 - k2, N = n1 + n2, K = k1 + k2;
  const minExp = Math.min(n1 * K / N, n1 * (N - K) / N, n2 * K / N, n2 * (N - K) / N);
  let p, test;
  if (minExp < 5) { p = fisher(a, b, c, d); test = "Fisher exact"; }
  else { const pp = K / N, se = Math.sqrt(pp * (1 - pp) * (1 / n1 + 1 / n2)); const z = se ? (k1 / n1 - k2 / n2) / se : 0; p = 2 * (1 - normCdf(Math.abs(z))); test = "two-proportion z"; }
  return { diff: k1 / n1 - k2 / n2, ci: newcombe(k1, n1, k2, n2), p, test };
}
function normCdf(x) { const t = 1 / (1 + 0.2316419 * Math.abs(x)); const d = 0.3989423 * Math.exp(-x * x / 2); const pr = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return x > 0 ? 1 - pr : pr; }
function median(a) { if (!a.length) return NaN; const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function bootMedianClustered(groups, stat, B) { // groups: array of arrays of values; resample groups
  B = B || 2000; const r = rng(20260914); const out = [];
  if (groups.length < 2) return [NaN, NaN];
  for (let i = 0; i < B; i++) { const vals = []; for (let j = 0; j < groups.length; j++) { const g = groups[Math.floor(r() * groups.length)]; for (const v of g) vals.push(v); } out.push(stat(vals)); }

  const gap = val(S.K71.a) - val(S.K71.b); const t = twoProp(S.K71.a.k, S.K71.a.n, S.K71.b.k, S.K71.b.n);
  const trial = Math.max(val(S.K15P), val(S.K15Q));
  const seg = ["Student", "Working"].map(o => { const x = rows.filter(r => r.occ === o); const s = surveyKpis(x); return { o, s }; });
  const offerStack = shownCities().map(c => { const x = rows.filter(r => r.city === c && r.status === "ordered"); return { label: c, segs: [{ name: "First-order discount / offer", v: x.filter(r => r.offer === "yes").length, c: "--c-p", lt: true }, { name: "No offer", v: x.filter(r => r.offer === "no").length, c: "--c-own" }, { name: "Don't remember", v: x.filter(r => r.offer === "unknown").length, c: "--g3", lt: true }] }; });
  let verdict;
  if (S.K71.a.n < 5 || S.K71.b.n < 5) verdict = `<span class="chip neutral">? Not testable yet (needs A2)</span>`;
  else if (gap >= 0.1 && val(S.K32) < trial / 2) verdict = `<span class="chip crit">✕ DEPRIORITIZE heavy discounting</span>`;
  else if (Math.abs(val(seg[0].s.K71.a) - val(seg[0].s.K71.b) - (val(seg[1].s.K71.a) - val(seg[1].s.K71.b))) >= 0.1 && seg.every(x => x.s.K71.a.n >= 5 && x.s.K71.b.n >= 5)) verdict = `<span class="chip warn">◎ TARGET TO SEGMENT</span>`;
  else if (gap >= 0.1 && val(S.K70) >= 0.5) verdict = `<span class="chip warn">↻ MODIFY: smaller offer + second-order incentive</span>`;
  else verdict = `<span class="chip good">✓ KEEP</span>`;
  return `<div class="page-head"><p class="eyebrow">Page 8 · Promotion: growth or rented demand?</p><h2>Do first-order offers create retained users, or only subsidised trial?</h2>
    <p class="sub">No public source shows a ₹50/₹100 <i>game</i> (checked 2026-09-16). The only verified offer is 50% off the first order, capped at ₹100 (Bengaluru). Game-specific effects stay NOT TESTABLE until P3 captures a dated screenshot.${demoTag("survey")}</p></div>
  <div class="banner" style="grid-template-columns:1fr"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="eyebrow">Promotion call (rule 2.4)</span>${verdict}</div></div>
  <div class="kpis">
    ${tile({ id: "K70", name: "First orders that used an offer", m: S.K70, ev: "self-reported · A2", demo: DS.survey.demo })}
    ${tile({ id: "K71", name: "Promo-dependency gap (organic − offer repeat)", m: { n: Math.min(S.K71.a.n, S.K71.b.n) }, n: Math.min(S.K71.a.n, S.K71.b.n) >= 10 ? Math.min(S.K71.a.n, S.K71.b.n) : Math.min(S.K71.a.n, S.K71.b.n), v: gap, fmt: x => pp(x), ci: t.ci, base: `${t.test} p = ${fmtP(t.p)}`, ev: "association", demo: DS.survey.demo, breach: S.K71.b.n >= 5 && gap >= 0.2 })}
    ${tile({ id: "K32", name: "Would stay after the ₹100 offer ends", m: S.K32, cmp: `trial intent ${pct(trial)}`, ev: "stated", demo: DS.survey.demo })}
  </div>
  <div class="grid-3">
    ${panel({ title: "Did the first Ownly order use an offer?", body: stack(offerStack), q: "How much trial is subsidised (K70)?", src: "Survey addition A2", n: `n = ${S.K70.n}`, seg: segText(), read: `${pct(val(S.K70))} of first orders used an offer.`, impl: val(S.K70) >= 0.5 ? "Trial is mostly subsidised, so retention of these users is the question." : "Trial is largely organic." })}
    ${panel({ title: "Repeat rate: organic vs offer-acquired", legend: `<div class="legend"><span><i style="background:var(--c-own)"></i>No offer</span><span><i style="background:var(--c-p)"></i>Offer</span></div>`, body: bars([{ label: "≥2 Ownly orders in 8 weeks", series: [{ name: "No offer", color: "--c-own", k: S.K71.a.k, n: S.K71.a.n }, { name: "Offer", color: "--c-p", k: S.K71.b.k, n: S.K71.b.n }] }]), q: "Do offer-acquired triers repeat less (K71)?", src: "A2 × S4-Q3/S12-Q4", n: `${S.K71.a.n} organic · ${S.K71.b.n} offer`, seg: segText(), read: `Gap ${pp(gap)} (CI ${pp(t.ci[0])} to ${pp(t.ci[1])}). Offer users may be more price-sensitive, so this is not the causal effect of the offer.`, impl: gap >= 0.1 ? "Offers rent demand that doesn't stay." : "Offer users retain about as well." })}
    ${panel({ title: "Intent to try vs intent to stay", body: bars([{ label: "Would try (best of P/Q, top-2)", series: [{ name: "try", color: "--bar", k: Math.round(trial * S.K15P.n), n: S.K15P.n }] }, { label: "Would stay after the offer ends (top-2)", series: [{ name: "stay", color: "--c-own", k: S.K32.k, n: S.K32.n }] }], { mid: trial / 2 }), q: "Does demand survive the subsidy (K15 vs K32)?", src: "Survey S7-Q1/Q2, S7-Q5", n: `n = ${S.K32.n}`, seg: segText(), read: `The dashed line marks half of trial intent. Staying intent at ${pct(val(S.K32))} is ${val(S.K32) < trial / 2 ? "below" : "above"} it.`, impl: val(S.K32) < trial / 2 ? "Most acquired intent evaporates when the offer ends." : "A majority of acquired intent survives." })}
  </div>
  ${panel({ title: "Students vs working professionals", body: `<div class="tscroll"><table><thead><tr><th>Segment</th><th class="n">Offer-triggered first order</th><th class="n">Repeat: organic</th><th class="n">Repeat: offer</th><th class="n">Would stay without offer</th></tr></thead><tbody>${seg.map(x => `<tr><td>${x.o}</td><td class="n">${x.s.K70.n >= 10 ? pct(val(x.s.K70)) : "n<10"}</td><td class="n">${x.s.K71.a.n >= 5 ? pct(val(x.s.K71.a)) + " (" + x.s.K71.a.n + ")" : "—"}</td><td class="n">${x.s.K71.b.n >= 5 ? pct(val(x.s.K71.b)) + " (" + x.s.K71.b.n + ")" : "—"}</td><td class="n">${x.s.K32.n >= 10 ? pct(val(x.s.K32)) : "n<10"}</td></tr>`).join("")}</tbody></table></div>`, q: "Should offers target one segment?", src: "Survey A2, S7-Q5 by S3-Q1", n: "Shown per cell", seg: "Occupation filter ignored here", read: "A difference of 10pp or more in the promo gap between segments triggers TARGET TO SEGMENT.", impl: "Where to spend first-order subsidy." })}`;
}

/* ================= Page 9 · Segments ================= */
function page9() {
  const base = elig().filter(r => (F.city === "All" || r.city === F.city));
  const tot = r => r.cS + r.cZ + r.cO + r.cX;
  const medAmt = median(base.filter(r => r.amount != null).map(r => r.amount));
  const segs = [["Everyone", r => true], ["Students", r => r.occ === "Student"], ["Working professionals", r => r.occ === "Working"], ["Frequent (6+ orders / 4 wks)", r => r.ordered && tot(r) >= 6], ["Light (1–5 orders)", r => r.ordered && tot(r) < 6], ["Rapido users", r => r.rapido >= 1], ["Non-Rapido users", r => r.rapido === 0], ["Price-first (≥2 of 3)", r => r.t1 + r.t2 + r.t3 >= 2], ["Speed/reliability-first", r => r.t1 != null && r.t1 + r.t2 + r.t3 < 2], ["High basket (≥ median)", r => r.amount != null && r.amount >= medAmt], ["Delivery members", r => r.member === "member"], ["Gachibowli core", r => r.area === "Gachibowli" || r.area === "Financial District / Nanakramguda"]];
  const cell = (m, f) => m.n >= 10 ? (f ? f(m) : pct(val(m))) : `<span class="muted">—</span>`;
  const body = segs.map(([name, f]) => { const x = base.filter(f); const s = surveyKpis(x); const ord = x.filter(r => r.ordered); const avg = ord.length ? (ord.reduce((a, r) => a + tot(r), 0) / ord.length).toFixed(1) : "—";
    return `<tr><td>${name}</td><td class="n">${x.length}</td><td class="n">${ord.length >= 10 ? avg : "—"}</td><td class="n">${cell(s.K10)}</td><td class="n">${cell(s.K01)}</td><td class="n">${cell(s.priceFirst)}</td><td class="n">${cell(s.K32)}</td><td class="n">${cell(s.K70)}</td><td class="n">${s.K33.resp >= 10 ? pct(val(s.K33)) : "—"}</td><td class="n">${s.choice.n >= 10 ? pct(s.choice.q / s.choice.n) : "—"}</td></tr>`; }).join("");
  return `<div class="page-head"><p class="eyebrow">Page 9 · Segment prioritization</p><h2>Which segment should Hyderabad GTM enter through?</h2><p class="sub">Raw values with n; <b>no composite attractiveness score</b>, because any weighting would be arbitrary. Read across each row. Cells with n &lt; 10 are hidden. The city filter applies; occupation and Rapido filters don't.${demoTag("survey")}</p></div>
  ${panel({ title: "Segment matrix", body: `<div class="tscroll"><table><thead><tr><th>Segment</th><th class="n">n</th><th class="n">Orders / 4 wks</th><th class="n">Aware</th><th class="n">Tried</th><th class="n">Price-first</th><th class="n">Stay w/o offer</th><th class="n">Offer-led trial</th><th class="n">Share of req.</th><th class="n">Prefers Q</th></tr></thead><tbody>${body}</tbody></table></div>`,
    q: "Where do category frequency, awareness, trial, price sensitivity, repeat intent and proposition fit line up?", src: "Survey (all sections)", n: `n = ${base.length}`, seg: F.city === "All" ? "Hyderabad + Bengaluru" : F.city,
    read: "A strong entry segment orders often, already knows Ownly, isn't dependent on offers, and prefers the proposition Ownly will lead with.", impl: "Pick the segment that is highest on frequency and 'stay without offer' and lowest on 'offer-led trial'. Say which columns drove the pick." })}`;
}

/* ================= Page 10 · Final decision ================= */
function page10() {
  const S = surveyKpis(viewHyd()), SB = surveyKpis(cityRows("Bengaluru")), AU = auditKpis(), FD = fakeKpis();
  const H = h0Result(S, FD); const rows = transferRows(S, SB, AU, FD); const O = overall(S, AU, FD, rows, H);
  const impl = { KEEP: "Replicate as in Bengaluru.", ADAPT: "Keep, with the localisation or ops change named in the evidence.", DROP: "Don't lead Hyderabad GTM with it.", INSUFFICIENT: "Collect the missing input before deciding." };
  const groupsOrder = [["KEEP", "Keep: supported in Hyderabad"], ["ADAPT", "Adapt: works only with localisation or ops change"], ["DROP", "Drop / deprioritize"], ["INSUFFICIENT", "Not decidable yet"]];
  const means = H.reject && H.winner ? `The ${H.winner === "Q" ? "Hyderabad-localized (regulars + reliability)" : "Bengaluru-style (smaller final bill)"} proposition drew a significantly and practically higher ${H.source === "fake door" ? "click-through" : "stated preference"} among 20–30-year-olds in our sample.` : H.na ? "The test hasn't reached its minimum base." : "We found no evidence that the two propositions perform differently in our sample.";
  const notMeans = H.reject ? "It doesn't prove actual first orders or repeat use will differ, and doesn't generalise beyond our sample." : "It doesn't show they are equal. With our sample size, differences under about 15–20pp could go undetected.";
  return `<div class="page-head"><p class="eyebrow">Page 10 · Final proposition &amp; GTM decision</p><h2>What should Ownly keep, adapt or drop in Hyderabad?</h2></div>
  <div class="banner">
    <div style="display:grid;gap:10px;align-content:start"><p class="eyebrow">Overall call</p><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip big-chip ${O.cls}">${O.call}</span>${O.provisional ? `<span class="chip warn big-chip">PROVISIONAL</span>` : ""}</div><p>${esc(O.why)}</p></div>
    <div style="display:grid;gap:8px;align-content:start"><p class="eyebrow">H₀ · ${H.source}</p><span class="chip ${H.reject ? "good" : "neutral"}">${H.call}</span>
      <dl class="statlist"><div><dt>What it means</dt><dd style="text-align:left;max-width:36ch">${means}</dd></div><div><dt>What it does not mean</dt><dd style="text-align:left;max-width:36ch">${notMeans}</dd></div></dl></div>
  </div>
  ${groupsOrder.map(([v, title]) => { const g = rows.filter(r => r.v === v); if (!g.length) return ""; return `<section style="display:grid;gap:10px"><h3>${title}</h3><div class="cards">${g.map(r => `<article class="panel"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h3>${r.el}</h3>${vchip(r.v)}</div><p style="font-size:0.88rem">${esc(r.hyd)}</p><dl class="foot"><div><dt>Metrics</dt><dd class="num">${r.kpi}</dd></div><div><dt>Bengaluru</dt><dd>${esc(r.blr)}</dd></div><div><dt>Qualitative</dt><dd>Interview codes (04_interviews) · reviews as issue discovery</dd></div><div><dt>Confidence</dt><dd>${r.conf}</dd></div><div><dt>Implication</dt><dd>${impl[r.v]}</dd></div></dl></article>`).join("")}</div></section>`; }).join("")}
  <div class="grid-2">
    ${panel({ title: "Not calculable from our data", body: `<div class="rk">${["CAC / CPA: no acquisition spend (fake door ₹0)", "Retention cost, CLV: no margin or cost data", "ROAS, contribution margin, GMV, EBITDA: no revenue data", "Burn per order: not public; the ₹150–170 figure is unverified", "Market share: sample shares are not market shares", "Actual fulfilled-order repeat rate: needs Ownly's internal data"].map(x => `<div class="check"><span class="mark u">—</span><span>${x}</span></div>`).join("")}</div>`, q: "Which requested metrics did we refuse to fabricate?", src: "kpi_tree.md Layer 10", read: "These are shown so no one fills the gap with a guess.", impl: "Recommendations are about proposition and GTM, not unit economics." })}
    ${panel({ title: "Validate before citywide scale", body: `<div class="checks">${[["A real conversion test: live first-order A/B in Ownly Hyderabad, localized vs price creative", H.reject], ["A second audit round across 3+ drop points and weekend slots", AU.n >= 20], ["Hyderabad 8-week cohort repeat rate from Ownly's own data", false], ["Rapido-app integration and placement in Hyderabad confirmed", false], ["Human validation of review coding (37 rows)", false]].map(([t, ok]) => `<div class="check"><span class="mark ${ok ? "y" : "u"}">${ok ? "✓" : "○"}</span><span>${t}</span></div>`).join("")}</div>`, q: "What must be true before scaling beyond Gachibowli?", src: "decision_rules.md; data_gap_map.md", read: "Our evidence is stated, self-reported, or a single-drop-point audit.", impl: "Treat this as a go/no-go for a Gachibowli pilot, not for all of Hyderabad." })}
  </div>`;
}

/* ================= shell ================= */
const PAGES = [["Cockpit", page1], ["Bengaluru playbook", page2], ["Hyderabad market", page3], ["First vs second order", page4], ["Is it cheaper?", page5], ["Can it deliver?", page6], ["Rapido advantage", page7], ["Promotion", page8], ["Segments", page9], ["Final decision", page10]];
function renderSources() {
  document.getElementById("sources").innerHTML = Object.entries(DS).map(([k, d]) => `<div class="src"><div class="src-top"><span class="src-name">${d.label}</span><span class="pill ${d.demo ? "demo" : "live"}" title="${esc(d.file || "")}">${d.demo ? "Demo data" : "Live · " + esc(d.file)}</span></div>
    <div class="src-actions"><label class="btn" for="in-${k}">Load CSV</label><input class="file-in" type="file" id="in-${k}" data-k="${k}" accept=".csv,text/csv">${d.demo ? "" : `<button class="btn ghost" data-reset="${k}">Back to demo</button>`}<span class="err" id="err-${k}" hidden></span></div></div>`).join("");
}
function renderTabs() {
  document.getElementById("tabs").innerHTML = PAGES.map((p, i) => `<button role="tab" id="tab-${i + 1}" aria-selected="${PAGE === i + 1}" data-page="${i + 1}"><b>${i + 1}</b>${p[0]}</button>`).join("");
  Object.keys(FILTERS).forEach(k => { document.getElementById("f-" + k).innerHTML = FILTERS[k].map(([v, l]) => `<button type="button" id="f-${k}-${v}" data-f="${k}" data-v="${v}" aria-pressed="${F[k] === v}">${l}</button>`).join(""); });
  const e = elig(), byC = c => e.filter(r => r.city === c).length;
  document.getElementById("basebar").innerHTML = `Survey: <b class="num">${viewRows().length}</b> in view · Hyderabad <span class="num">${byC("Hyderabad")}</span> · Bengaluru <span class="num">${byC("Bengaluru")}</span> · ${DS.survey.data.length - e.length} screened out by age${Object.values(DS).some(d => d.demo) ? ' · <span class="tag demo">demo data present</span>' : ""}`;
}
function render(scrollTop) {
  renderTabs();
  const main = document.getElementById("page");
  try { main.innerHTML = PAGES[PAGE - 1][1](); }
  catch (err) { main.innerHTML = `<p class="note">This page couldn't be drawn from the loaded data: ${esc(err.message)}. Check that the files match the templates in 10_dashboard/decision_dashboard/dashboard_data_schema.csv.</p>`; console.error(err); }
  if (scrollTop) { main.focus({ preventScroll: true }); window.scrollTo({ top: document.querySelector(".nav").offsetTop - 4 }); }
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-page]"); if (t) { PAGE = +t.dataset.page; saveState(); render(true); return; }
  const f = e.target.closest("[data-f]"); if (f) { F[f.dataset.f] = f.dataset.v; saveState(); render(); return; }
  const r = e.target.closest("[data-reset]"); if (r) { const d = DS[r.dataset.reset]; d.data = d.make(); d.demo = true; d.file = null; if (r.dataset.reset === "frame" && DS.audit.demo) DS.audit.data = DS.audit.make(); renderSources(); render(); }
});
document.addEventListener("change", e => {
  const inp = e.target.closest("input[data-k]"); if (!inp || !inp.files[0]) return;
  const k = inp.dataset.k, file = inp.files[0], err = document.getElementById("err-" + k);
  if (!window.Papa) { err.textContent = "The CSV reader didn't load. Check your connection and reload."; err.hidden = false; return; }
  Papa.parse(file, { skipEmptyLines: true, complete: res => {
    try { const d = DS[k].map(res.data); if (!d.length) throw new Error("The file has headers but no rows yet."); DS[k].data = d; DS[k].demo = false; DS[k].file = file.name; renderSources(); render(); }
    catch (x) { err.textContent = x.message; err.hidden = false; }
    inp.value = "";
  }, error: () => { err.textContent = "Couldn't read that file. Use the .csv (unzip the Google Forms download first)."; err.hidden = false; } });
});
const tip = document.getElementById("tip");
document.addEventListener("pointermove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]"); if (!t) { tip.hidden = true; return; }
  tip.textContent = t.getAttribute("data-tip"); tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 12, y = e.clientY + 14;
  if (x + w > window.innerWidth - 8) x = e.clientX - w - 12; if (y + h > window.innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
renderSources(); render();
</script>
